[package]
name = "modebox"
description = "Sandboxed code execution for AI agents: run agent-written JS/TS in WebAssembly, shell commands in an OS sandbox, and an MCP code-mode server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["sandbox", "mcp", "ai-agents", "wasm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "modebox"
path = "src/main.rs"

[dependencies]
modebox-core = { workspace = true, features = ["cloud", "fetch"] }
anyhow.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
rand.workspace = true
clap = { version = "4", features = ["derive"] }
schemars = "1"
rmcp = { version = "3", features = ["server", "client", "macros", "transport-io", "transport-child-process", "elicitation", "schemars"] }
