[package]
name = "modebox-core"
description = "Run untrusted, agent-written JavaScript/TypeScript in a snapshot-able WebAssembly sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["typescript", "object-store"]
typescript = ["dep:swc_ts_fast_strip", "dep:swc_common", "dep:swc_ecma_parser", "dep:swc_ecma_ast"]
# Adapter for any `object_store` backend (memory/local built in).
object-store = ["dep:object_store", "dep:url"]
# `fetch()` for sandboxed code, through a host tool limited to allowed hosts.
fetch = ["dep:reqwest", "dep:url"]
# S3 (+ R2, MinIO…), GCS, Azure and HTTP drivers.
cloud = ["object-store", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
bytes = "1"
chacha20poly1305.workspace = true
futures.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1"
similar = "3"
object_store = { version = "0.14", default-features = false, features = ["fs"], optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
indexmap.workspace = true
libc.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
wasmtime.workspace = true
wasmtime-wizer.workspace = true
zstd.workspace = true
swc_ts_fast_strip = { version = "59", optional = true }
swc_common = { version = "26", optional = true }
swc_ecma_parser = { version = "46", optional = true }
swc_ecma_ast = { version = "29", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
