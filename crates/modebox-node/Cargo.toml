[package]
name = "modebox-node"
description = "Node.js bindings for modebox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
modebox-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "async", "dyn-symbols"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
