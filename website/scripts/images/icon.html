<!doctype html>
<!-- The app icon at any square size; scripts/images/render.sh renders it for
     apple-touch-icon.png (180px) and favicon.ico (32px). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: #151515; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32">
    <rect x="6.5" y="6.5" width="19" height="19" rx="3.5" fill="none" stroke="#ededed" stroke-width="1.6"/>
    <rect x="12" y="11" width="2.6" height="10" fill="#ededed"/>
    <rect x="17.4" y="11" width="2.6" height="10" fill="#ededed"/>
  </svg>
</body>
</html>
