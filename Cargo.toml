[workspace]
resolver = "3"
members = ["crates/modebox-core"]
exclude = ["guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[workspace.dependencies]
modebox-core = { path = "crates/modebox-core" }
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "io-std"] }
libc = "0.2"
wasmtime = "44"
wasmtime-wizer = { version = "44", features = ["wasmtime"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 4
