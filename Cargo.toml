[workspace]
resolver = "3"
members = ["crates/modebox-core", "crates/modebox-cli", "crates/modebox-node"]
exclude = ["guest"]

[workspace.package]
version = "0.1.1-rc.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/farming-labs/modebox"
homepage = "https://github.com/farming-labs/modebox"
readme = "README.md"

[workspace.dependencies]
modebox-core = { path = "crates/modebox-core", version = "0.1.1-rc.1" }
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "io-std", "net"] }
libc = "0.2"
wasmtime = "49"
wasmtime-wizer = { version = "49", features = ["wasmtime"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 4

# CI: optimized like release (some tests assert timings), but without LTO,
# which dominates the build time of the many test binaries.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
