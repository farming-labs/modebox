[package]
name = "modebox-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "QuickJS guest for modebox, compiled to wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Standalone workspace: this crate is built for wasm, separately from the host.
[workspace]
