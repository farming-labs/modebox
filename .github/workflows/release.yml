name: Release

# Pushing a `vX.Y.Z` tag builds every target and publishes the crates, the npm
# packages, the Python package and a GitHub Release. Running it by hand (Actions → Release → Run
# workflow) only builds and smoke-tests, so the matrix can be checked first.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: versions match the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"
          else
            echo "not a tag: building $(node scripts/version.mjs) without publishing"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, npm: darwin-arm64, lib: libmodebox_node.dylib }
          - { os: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64, lib: libmodebox_node.dylib }
          # 22.04 for an older glibc, so the binaries run on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64-gnu, lib: libmodebox_node.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64-gnu, lib: libmodebox_node.so }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The oldest Python the package supports, to test the wheel on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build
        run: cargo build --release --locked -p modebox -p modebox-node
      - name: Smoke test
        run: |
          test "$(target/release/modebox run -e '[1, 2, 3].map(x => x * 2).join()')" = "2,4,6"
          cp target/release/${{ matrix.lib }} packages/modebox/modebox.node
          cd packages/modebox && npm test
      - name: Package the CLI
        run: |
          dir=modebox-${{ matrix.target }}
          mkdir "$dir"
          cp target/release/modebox LICENSE README.md "$dir"/
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: modebox-${{ matrix.target }}.tar.gz*
      # One abi3 wheel per target serves every Python from 3.10 up.
      - name: Build the Python wheel
        run: |
          pip install 'maturin>=1.9,<2'
          maturin build --release --locked -m crates/modebox-python/Cargo.toml --out python-dist
      - name: Build the Python sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: maturin sdist -m crates/modebox-python/Cargo.toml --out python-dist
      # Installed into a fresh venv, so the tests import the wheel, not the
      # source tree.
      - name: Test the Python wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install python-dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s crates/modebox-python/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.npm }}
          path: target/release/${{ matrix.lib }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.target }}
          path: python-dist/*

  crates:
    name: publish crates
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No stored token: both crates trust this workflow, and the job's OIDC
      # identity is exchanged for a crates.io token that expires after 30
      # minutes and is revoked when the job ends (docs/releasing.md).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io
      # modebox-core first, then modebox; modebox-node isn't published.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

  npm:
    name: publish npm packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: bindings
      # No token: each package trusts this workflow, and npm exchanges the
      # job's OIDC identity for a short-lived publish token (docs/releasing.md).
      - name: Publish the platform packages, then modebox
        run: |
          # Prereleases (X.Y.Z-rc.1) go to the `next` dist-tag, not `latest`.
          tag=latest; [[ "$GITHUB_REF_NAME" == *-* ]] && tag=next
          version="${GITHUB_REF_NAME#v}"
          # Versions already on npm are skipped, so re-running after a partial
          # failure carries on from there. npm takes a few minutes to list a
          # new version, so a re-run sooner than that can still hit "cannot
          # publish over the previously published versions".
          publish() {
            if curl -sf -o /dev/null "https://registry.npmjs.org/$1/$version"; then
              echo "$1@$version is already on npm"
            else
              (cd packages/$1 && npm publish --access public --provenance --tag "$tag")
            fi
          }
          for p in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            cp bindings/npm-$p/* packages/modebox-$p/modebox.node
            cp LICENSE packages/modebox-$p/
            publish modebox-$p
          done
          cp LICENSE README.md packages/modebox/
          publish modebox

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      # No token: the PyPI project trusts this workflow, and the action
      # exchanges the job's OIDC identity for a short-lived upload token
      # (docs/releasing.md). Files already on PyPI are skipped, so a re-run
      # after a partial failure carries on from there.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    name: GitHub release
    needs: [crates, npm, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, or generated notes if there isn't one.
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" "${notes[@]}" \
            $([[ "$version" == *-* ]] && echo --prerelease)
